# Broker config (AD-15). mosquitto.conf is the native broker's, started by
# npm run broker; compose.conf is identical except for the listener, for
# infra/compose.yaml, which publishes it on 127.0.0.1:1883 only. Both run with
# the repo layout as the working directory, so persistence lands in
# infra/mosquitto/data/ (gitignored). Only options common to Mosquitto 2.0 and 2.1.

listener 1883
allow_anonymous true

persistence true
persistence_location infra/mosquitto/data/
autosave_interval 10

# 0 = no limit: QoS 1 messages queue for the backend's clean: false session
# while it restarts (AD-5, offline retention).
max_queued_messages 0
